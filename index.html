
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feliz cumpleaños mi damita</title>

    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/inicio.js" defer></script>
</head>

<body>

    <main class="pantalla-inicio">

        <div class="decoracion decoracion-1">♡</div>
        <div class="decoracion decoracion-2">✦</div>
        <div class="decoracion decoracion-3">✧</div>
        <div class="decoracion decoracion-4">♡</div>
        <div class="decoracion decoracion-5">✦</div>
        <div class="decoracion decoracion-6">✧</div>

        <section class="contenedor-sorpresa">

            <div class="encabezado">
                <span class="detalle-encabezado">✧ ♡ ✧</span>

                <p class="texto-superior">
                    Una sorpresa preparada con amor
                </p>
            </div>

            <div class="contenido-principal">

                <div class="adorno-floral">
                    ❀
                </div>

                <h1>
                    ¡Feliz cumpleaños
                    <span>mi damita!</span>
                </h1>

                <p class="fecha">
                    29 de noviembre de 2026
                </p>

                <div class="separador">
                    <span>♡</span>
                </div>

                <p class="mensaje-inicial">
                    Hoy he preparado algo muy especial para ti...
                </p>

                <p class="mensaje-secundario">
                    Una historia, muchos recuerdos
                    y algunas sorpresas.
                </p>

                <form id="formulario-acceso">

                    <label for="contrasena">
                        Introduce la contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        placeholder="Escribe aquí..."
                        autocomplete="off"
                        required
                    >

                    <button type="submit" id="boton-ingresar">
                        Descubrir mi sorpresa ♡
                    </button>

                    <p id="mensaje-error" class="mensaje-error"></p>

                </form>

            </div>

            <footer class="pie-pagina">
                <p>Con amor, para celebrar tu día</p>
                <span>♡ ✧ ♡</span>
            </footer>

        </section>

    </main>

</body>
</html>
